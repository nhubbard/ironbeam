name: Recover Ironbeam workspace publication

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type publish-<workspace version> after reviewing the release gates'
        required: true
        type: string
      start_at:
        description: 'First package to publish; leave blank for the full dependency order'
        required: false
        type: string

permissions: { }

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --no-self-update
          rustup default nightly
      - name: Check workspace release order
        run: python3 scripts/check_v5_release_order.py --release
      - name: Require first-release crates.io token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo 'Configure the CRATES_IO_TOKEN release secret for the first publication of new crate names.' >&2
            exit 1
          fi
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          IRONBEAM_RELEASE_CONFIRM: ${{ inputs.confirm }}
          IRONBEAM_RELEASE_START_AT: ${{ inputs.start_at }}
        run: |
          IRONBEAM_RELEASE_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          export IRONBEAM_RELEASE_VERSION
          bash scripts/publish_v5_packages.sh publish
