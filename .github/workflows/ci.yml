name: CI

on:
  push:
    branches: [ 'main' ]
  pull_request: { }
  workflow_dispatch: { }

permissions: { }

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-clippy-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --component clippy --no-self-update
          rustup default nightly

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Clippy with pedantic and nursery
        run: |
          cargo clippy -p ironbeam --all-targets --all-features -- \
            -W clippy::pedantic \
            -W clippy::nursery \
            -D warnings
          cargo clippy --no-deps -p ironbeam-runner-contract-tests --all-targets -- \
            -W clippy::pedantic \
            -W clippy::nursery \
            -D warnings
          cargo clippy -p ironbeam-compression -p ironbeam-cloud-objects -p ironbeam-cloud -p ironbeam-cloud-object-store -p ironbeam-core -p ironbeam-direct -p ironbeam-metrics -p ironbeam-testing -p ironbeam-transforms -p ironbeam-transform-regex -p ironbeam-transform-approx -p ironbeam-io -p ironbeam-io-jsonl -p ironbeam-io-protobuf -p ironbeam-io-tfrecord -p ironbeam-io-csv -p ironbeam-io-xml -p ironbeam-io-msgpack -p ironbeam-io-cbor -p ironbeam-io-avro -p ironbeam-io-parquet -p ironbeam-io-arrow -p ironbeam-io-sql -p ironbeam-io-mongodb -p ironbeam-compat --all-targets -- \
            -W clippy::pedantic \
            -W clippy::nursery \
            -D warnings

  feature-matrix:
    name: Feature Matrix
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-feature-matrix-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --no-self-update
          rustup default nightly

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-hack
        run: cargo install cargo-hack --locked

      # Every feature toggled independently (each alone, none, all) must compile.
      # A full powerset is intractable in CI; --each-feature catches the
      # feature-coupling class of bugs in N+2 builds.
      - name: Check all feature combinations compile
        run: cargo hack check -p ironbeam --each-feature --no-dev-deps --keep-going

      - name: Check facade build modes independently
        run: |
          cargo build -p ironbeam --no-default-features
          cargo build -p ironbeam --no-default-features --features v5-preview
          cargo build -p ironbeam --no-default-features --features v5-io-csv
          cargo build -p ironbeam --no-default-features --features v5-regex
          cargo build -p ironbeam --no-default-features --features v5-approx
          cargo build -p ironbeam --no-default-features --features v5-metrics
          cargo build -p ironbeam --no-default-features --features v5-io-xml
          cargo build -p ironbeam --no-default-features --features v5-io-msgpack
          cargo build -p ironbeam --no-default-features --features v5-io-cbor
          cargo build -p ironbeam --no-default-features --features v5-io-protobuf
          cargo build -p ironbeam --no-default-features --features v5-io-tfrecord
          cargo build -p ironbeam
          cargo build -p ironbeam --features v5-preview
          cargo build -p ironbeam --all-features
          cargo build -p ironbeam-runner-contract-tests
          cargo build -p ironbeam-core
          cargo build -p ironbeam-direct
          cargo build -p ironbeam-metrics
          cargo build -p ironbeam-transforms
          cargo build -p ironbeam-transform-regex
          cargo build -p ironbeam-transform-approx
          cargo build -p ironbeam-io
          cargo build -p ironbeam-io --no-default-features
          cargo build -p ironbeam-io-jsonl
          cargo build -p ironbeam-io-protobuf
          cargo build -p ironbeam-io-tfrecord
          cargo build -p ironbeam-io-csv
          cargo build -p ironbeam-io-xml
          cargo build -p ironbeam-io-msgpack
          cargo build -p ironbeam-io-cbor
          cargo build -p ironbeam-io-avro
          cargo build -p ironbeam-io-parquet
          cargo build -p ironbeam-io-arrow
          cargo build -p ironbeam-io-sql
          cargo build -p ironbeam-io-mongodb
          cargo build -p ironbeam-compression
          cargo build -p ironbeam-cloud-object-store
          cargo build -p ironbeam-compat

      - name: Test v5 file formats independently
        run: |
          cargo test -p ironbeam-io --no-default-features --features file
          cargo test -p ironbeam-compression --all-features
          cargo test -p ironbeam-cloud-object-store --all-features
          cargo test -p ironbeam-io-jsonl --all-features
          cargo test -p ironbeam-io-protobuf --all-features
          cargo test -p ironbeam-io-tfrecord --all-features
          cargo test -p ironbeam --features v5-io-tfrecord,io-tfrecord,io-protobuf --test v5_tfrecord_examples
          cargo test -p ironbeam-io-csv --all-features
          cargo test -p ironbeam-io-xml --all-features
          cargo test -p ironbeam-io-msgpack --all-features
          cargo test -p ironbeam-io-cbor --all-features
          cargo test -p ironbeam-transform-regex --all-features
          cargo test -p ironbeam-transform-approx --all-features
          cargo test -p ironbeam-metrics
          cargo test -p ironbeam-direct --features metrics --test custom_metrics
          cargo test -p ironbeam-io-avro --all-features
          cargo test -p ironbeam-io-parquet --all-features
          cargo test -p ironbeam-io-arrow --all-features

      # With the I/O features off, the always-present API must fail at runtime.
      - name: Verify disabled-feature runtime stubs
        run: cargo test -p ironbeam --no-default-features --features legacy-v4 --test feature_gating

      - name: Test facade default and minimal modes
        run: |
          cargo test -p ironbeam --lib --tests
          cargo test -p ironbeam --no-default-features --features legacy-v4 --lib --tests
          cargo test -p ironbeam --no-default-features --features v5-preview --lib --tests

      - name: Compare v4 and v5 direct elementwise results
        run: cargo test -p ironbeam --features legacy-v4,v5-preview --test v5_direct_differential

  test:
    name: Facade Tests with Coverage
    runs-on: ubuntu-latest
    environment: main
    concurrency:
      group: ${{ github.workflow }}-test-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --component llvm-tools-preview --no-self-update
          rustup default nightly

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Install rustfilt
        run: cargo install rustfilt

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      # Docker-backed MongoDB and SQL tests run in the separate service tier.
      # Package selection keeps workspace feature unification from hiding a
      # missing dependency in either package.
      - name: Generate portable facade coverage
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          cargo llvm-cov -p ironbeam --all-features --branch --json --summary-only \
            --output-path coverage-ironbeam.json -- \
            --skip io::mongodb --skip io::sql_containers
          python3 scripts/check_coverage.py ironbeam coverage-ironbeam.json | tee -a "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --branch --lcov --output-path lcov.info

      - name: Demangle coverage output
        run: rustfilt -i lcov.info -o lcov-demangled.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: lcov-demangled.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  contract-tests:
    name: Runner Contract Test Package
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-contract-tests-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --component llvm-tools-preview --no-self-update
          rustup default nightly

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Test and measure contract package independently
        run: |
          cargo test -p ironbeam-runner-contract-tests
          cargo llvm-cov -p ironbeam-runner-contract-tests --branch --json --summary-only \
            --output-path coverage-contract.json
          python3 scripts/check_coverage.py ironbeam-runner-contract-tests coverage-contract.json | tee -a "$GITHUB_STEP_SUMMARY"

  v5-coverage:
    name: V5 Package Coverage (${{ matrix.package }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        package: [ironbeam-compression, ironbeam-cloud-objects, ironbeam-core, ironbeam-direct, ironbeam-metrics, ironbeam-transforms, ironbeam-transform-regex, ironbeam-transform-approx, ironbeam-io, ironbeam-io-jsonl, ironbeam-io-protobuf, ironbeam-io-tfrecord, ironbeam-io-csv, ironbeam-io-xml, ironbeam-io-msgpack, ironbeam-io-cbor, ironbeam-io-avro, ironbeam-io-parquet, ironbeam-io-arrow, ironbeam-compat]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --component llvm-tools-preview --no-self-update
          rustup default nightly
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov
      - name: Test and measure package independently
        run: |
          cargo test -p "${{ matrix.package }}"
          features=()
          if [ "${{ matrix.package }}" = "ironbeam-compression" ] || [ "${{ matrix.package }}" = "ironbeam-io-jsonl" ] || [ "${{ matrix.package }}" = "ironbeam-io-protobuf" ] || [ "${{ matrix.package }}" = "ironbeam-io-tfrecord" ] || [ "${{ matrix.package }}" = "ironbeam-io-csv" ] || [ "${{ matrix.package }}" = "ironbeam-io-xml" ] || [ "${{ matrix.package }}" = "ironbeam-io-msgpack" ] || [ "${{ matrix.package }}" = "ironbeam-io-cbor" ] || [ "${{ matrix.package }}" = "ironbeam-io-avro" ] || [ "${{ matrix.package }}" = "ironbeam-io-parquet" ] || [ "${{ matrix.package }}" = "ironbeam-io-arrow" ]; then features=(--all-features); fi
          if [ "${{ matrix.package }}" = "ironbeam-io" ]; then
            cargo llvm-cov -p ironbeam-io -p ironbeam-io-jsonl -p ironbeam-io-protobuf -p ironbeam-io-tfrecord -p ironbeam-io-csv -p ironbeam-io-xml -p ironbeam-io-msgpack -p ironbeam-io-cbor -p ironbeam-io-avro -p ironbeam-io-parquet -p ironbeam-io-arrow \
              --all-features --branch --json --output-path coverage-v5.json
          elif [ "${{ matrix.package }}" = "ironbeam-core" ]; then
            cargo llvm-cov -p ironbeam-core -p ironbeam-direct -p ironbeam-transforms \
              --branch --json --output-path coverage-v5.json
          else
            cargo llvm-cov -p "${{ matrix.package }}" "${features[@]}" \
              --branch --json --output-path coverage-v5.json
          fi
          python3 scripts/check_coverage.py "${{ matrix.package }}" coverage-v5.json | tee -a "$GITHUB_STEP_SUMMARY"

  service-tests:
    name: Docker Service Tests (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --no-self-update
          rustup default nightly

      - name: Test MongoDB and SQL containers
        run: |
          cargo test -p ironbeam --all-features --test lib io::mongodb
          cargo test -p ironbeam --all-features --test lib io::sql_containers

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-docs-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --no-self-update
          rustup default nightly

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build docs
        run: cargo doc --workspace --all-features --no-deps

  examples:
    name: Examples
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-examples-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --no-self-update
          rustup default nightly

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build all examples
        run: cargo build --examples --all-features

      - name: Run all examples
        run: |
          for example in examples/*.rs; do
            example_name=$(basename "$example" .rs)
            if [ "$example_name" = "v5_benchmark_corpus" ]; then
              continue
            fi
            echo "Running example: $example_name"
            cargo run --example "$example_name" --all-features || exit 1
          done
