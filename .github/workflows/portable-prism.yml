name: Portable Prism

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

jobs:
  prism:
    name: Beam worker and Prism
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-prism-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: apache/beam
          ref: 7d93ef8e76aa3fd7874e760010f6479fba40721a
          path: beam
          sparse-checkout: sdks
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version-file: beam/sdks/go.mod
      - name: Install Rust and protobuf compiler
        run: |
          rustup toolchain install nightly --component clippy --no-self-update
          rustup default nightly
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Build Prism
        working-directory: beam/sdks
        run: go build -o "$RUNNER_TEMP/prism" ./go/cmd/prism
      - name: Start Prism
        run: |
          "$RUNNER_TEMP/prism" -job_port=8073 -serve_http=false > "$RUNNER_TEMP/prism.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/prism.pid"
          for attempt in {1..60}; do
            if nc -z 127.0.0.1 8073; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/prism.log"
          exit 1
      - name: Test portable crates and live Prism jobs
        env:
          IRONBEAM_PRISM_ENDPOINT: localhost:8073
        run: |
          cargo test -p beam-proto -p ironbeam-graphx -p ironbeam-harness -p ironbeam-dataflow --locked
          # Residual scheduling and multi-format fanout vary between runs.
          for attempt in {1..8}; do
            cargo test -p ironbeam-prism-proof --test prism_v5_run --locked prism_runs_production_unbounded_source_with_residual_resume -- --exact
          done
          if ! cargo test -p ironbeam-prism-proof --test prism_v5_run --locked -- --test-threads=1 --skip prism_fails_closed_on_supervised_worker_loss_with_active_bundles --skip prism_runs_production_unbounded_source_with_residual_resume; then
            # The pinned Prism can panic while registering new pending work.
            # Retry only this upstream process failure; ordinary test failures
            # keep their first result.
            if ! grep -q 'panic: sync: WaitGroup is reused before previous Wait has returned' "$RUNNER_TEMP/prism.log"; then
              exit 1
            fi
            echo 'Pinned Prism exited with its WaitGroup panic; retrying the complete suite once.'
            for attempt in {1..30}; do
              if ! nc -z 127.0.0.1 8073; then break; fi
              sleep 1
            done
            if nc -z 127.0.0.1 8073; then
              echo 'Prism still holds the job port after the panic.'
              exit 1
            fi
            "$RUNNER_TEMP/prism" -job_port=8073 -serve_http=false > "$RUNNER_TEMP/prism-retry.log" 2>&1 &
            echo $! > "$RUNNER_TEMP/prism.pid"
            for attempt in {1..60}; do
              if nc -z 127.0.0.1 8073; then break; fi
              sleep 1
            done
            if ! nc -z 127.0.0.1 8073; then
              cat "$RUNNER_TEMP/prism-retry.log"
              exit 1
            fi
            cargo test -p ironbeam-prism-proof --test prism_v5_run --locked -- --test-threads=1 --skip prism_fails_closed_on_supervised_worker_loss_with_active_bundles --skip prism_runs_production_unbounded_source_with_residual_resume
          fi
          cargo test -p ironbeam-prism-proof --test prism_arrow --locked
          cargo test -p ironbeam-prism-proof --test hosted_object_streaming --locked
      - name: Test worker loss against fresh Prism
        env:
          IRONBEAM_PRISM_ENDPOINT: localhost:8073
        run: |
          kill "$(cat "$RUNNER_TEMP/prism.pid")"
          for attempt in {1..60}; do
            if ! nc -z 127.0.0.1 8073; then break; fi
            sleep 1
          done
          if nc -z 127.0.0.1 8073; then
            echo "Prism did not stop before the worker-loss proof"
            exit 1
          fi
          "$RUNNER_TEMP/prism" -job_port=8073 -serve_http=false > "$RUNNER_TEMP/prism-loss.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/prism.pid"
          for attempt in {1..60}; do
            if nc -z 127.0.0.1 8073; then break; fi
            sleep 1
          done
          if ! nc -z 127.0.0.1 8073; then
            cat "$RUNNER_TEMP/prism-loss.log"
            exit 1
          fi
          cargo test -p ironbeam-prism-proof --test prism_v5_run --locked prism_fails_closed_on_supervised_worker_loss_with_active_bundles -- --exact
      - name: Lint portable crates and fixture
        run: |
          cargo clippy -p beam-proto -p ironbeam-graphx -p ironbeam-harness -p ironbeam-dataflow -p ironbeam-prism-proof -p ironbeam-dataflow-wordcount --all-targets --locked -- -D warnings
      - name: Show Prism log on failure
        if: failure()
        run: |
          cat "$RUNNER_TEMP/prism.log" || true
          cat "$RUNNER_TEMP/prism-retry.log" || true
          cat "$RUNNER_TEMP/prism-loss.log" || true
