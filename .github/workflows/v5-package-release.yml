name: V5 Package Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Check package readiness or publish in dependency order"
        required: true
        type: choice
        default: check
        options:
          - check
          - publish

permissions: {}

jobs:
  check:
    if: inputs.mode == 'check'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --no-self-update
          rustup default nightly
      - run: bash scripts/release_v5_packages.sh check

  publish:
    if: inputs.mode == 'publish'
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: v5-package-release
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --no-self-update
          rustup default nightly
      - name: Authenticate with crates.io
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5
      - name: Publish v5 packages in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: bash scripts/release_v5_packages.sh publish
