name: Release

on:
  workflow_dispatch:

permissions: { }

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    environment: release  # requires manual approval via GitHub environment protection rules
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write       # create GitHub releases and push changelog commits
      issues: write         # comment on issues closed by a release
      pull-requests: write  # comment on PRs included in a release
      id-token: write       # exchange GitHub OIDC identity for a crates.io token

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Require main and validate the workspace release order
        run: |
          test "$GITHUB_REF" = refs/heads/main
          python3 scripts/check_v5_release_order.py --release

      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --no-self-update
          rustup default nightly
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: 'lts/*'

      - name: Install semantic-release and plugins
        run: npm ci

      - name: Authenticate with crates.io (trusted publishing)
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: npx semantic-release
