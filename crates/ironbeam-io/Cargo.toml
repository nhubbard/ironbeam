[package]
name = "ironbeam-io"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license = "MIT"
description = "Bounded file sources and transactional final-result sinks for Ironbeam 5"
repository = "https://github.com/nhubbard/ironbeam"

[features]
default = ["jsonl", "csv", "parquet", "avro", "xml"]
jsonl = []
csv = ["dep:csv"]
parquet = ["dep:parquet", "dep:arrow", "dep:serde_arrow", "dep:bytes"]
arrow-ipc = ["dep:arrow", "dep:serde_arrow"]
avro = ["dep:apache-avro"]
xml = ["dep:quick-xml"]
msgpack = ["dep:rmp-serde"]
cbor = ["dep:ciborium"]
protobuf = ["dep:prost"]
tfrecord = ["dep:crc32c"]
sql = ["dep:sqlx", "dep:tokio"]
mongodb = ["dep:mongodb", "dep:bson", "dep:tokio"]
cloud = ["dep:ironbeam-cloud"]

[dependencies]
ironbeam-core = { version = "0.1.0", path = "../ironbeam-core" }
ironbeam-cloud = { version = "0.1.0", path = "../ironbeam-cloud", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
csv = { version = "1", optional = true }
parquet = { version = "59", optional = true }
arrow = { version = "59", optional = true }
serde_arrow = { version = "0.15", features = ["arrow-59"], optional = true }
bytes = { version = "1", optional = true }
apache-avro = { version = "0.22", optional = true }
quick-xml = { version = "0.41", features = ["serialize"], optional = true }
rmp-serde = { version = "1", optional = true }
ciborium = { version = "0.2", optional = true }
prost = { version = "0.13", optional = true }
crc32c = { version = "0.6", optional = true }
sqlx = { version = "0.9", features = ["any", "postgres", "mysql", "sqlite", "runtime-tokio", "tls-rustls-ring"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
mongodb = { version = "3", features = ["bson-3"], optional = true }
bson = { version = "3", optional = true }

[dev-dependencies]
ironbeam-direct = { version = "0.1.0", path = "../ironbeam-direct" }
testcontainers = { version = "0.27", features = ["blocking"] }
testcontainers-modules = { version = "0.15", features = ["mongo"] }
