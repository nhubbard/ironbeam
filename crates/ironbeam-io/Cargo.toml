[package]
name = "ironbeam-io"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license = "MIT"
description = "Bounded file sources and transactional final-result sinks for Ironbeam 5"
repository = "https://github.com/nhubbard/ironbeam"

[features]
default = ["jsonl", "parallel-io"]
file = []
jsonl = []
protobuf = ["dep:prost"]
tfrecord = ["dep:crc32c"]
cloud = ["dep:ironbeam-cloud"]
parallel-io = []
compression-gzip = ["dep:ironbeam-cloud", "ironbeam-cloud/compression-gzip"]
compression-zstd = ["dep:ironbeam-cloud", "ironbeam-cloud/compression-zstd"]
compression-bzip2 = ["dep:ironbeam-cloud", "ironbeam-cloud/compression-bzip2"]
compression-xz = ["dep:ironbeam-cloud", "ironbeam-cloud/compression-xz"]

[dependencies]
ironbeam-core = { version = "0.1.0", path = "../ironbeam-core" }
ironbeam-cloud = { version = "0.1.0", path = "../ironbeam-cloud", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
glob = "0.3"
prost = { version = "0.13", optional = true }
crc32c = { version = "0.6", optional = true }

[dev-dependencies]
ironbeam-direct = { version = "0.1.0", path = "../ironbeam-direct" }
