[package]
name = "ironbeam-io"
version = "5.0.0"
edition = "2024"
rust-version = "1.94.0"
license = "MIT"
description = "Bounded file sources and transactional final-result sinks for Ironbeam 5"
repository = "https://github.com/nhubbard/ironbeam"

[features]
default = ["file", "parallel-io"]
file = ["dep:serde_json"]
cloud = ["dep:ironbeam-cloud-objects"]
parallel-io = []
compression-gzip = ["dep:ironbeam-compression", "ironbeam-compression/compression-gzip"]
compression-zstd = ["dep:ironbeam-compression", "ironbeam-compression/compression-zstd"]
compression-bzip2 = ["dep:ironbeam-compression", "ironbeam-compression/compression-bzip2"]
compression-xz = ["dep:ironbeam-compression", "ironbeam-compression/compression-xz"]

[dependencies]
ironbeam-core = { version = "5.0.0", path = "../ironbeam-core" }
ironbeam-cloud-objects = { version = "5.0.0", path = "../ironbeam-cloud-objects", optional = true }
ironbeam-compression = { version = "5.0.0", path = "../ironbeam-compression", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
sha2 = "0.11"
tempfile = "3"
glob = "0.3"

[dev-dependencies]
ironbeam-direct = { version = "5.0.0", path = "../ironbeam-direct" }
ironbeam-cloud-object-store = { version = "5.0.0", path = "../ironbeam-cloud-object-store" }
object_store = { version = "0.14.2", default-features = false }
