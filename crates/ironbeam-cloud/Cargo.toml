[package]
name = "ironbeam-cloud"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license = "MIT"
description = "Provider-neutral cloud contracts and helpers for Ironbeam"
repository = "https://github.com/nhubbard/ironbeam"

[dependencies]
ironbeam-compression = { version = "0.1.0", path = "../ironbeam-compression" }
ironbeam-cloud-objects = { version = "0.1.0", path = "../ironbeam-cloud-objects" }
ironbeam-cloud-service-api = { version = "0.1.0", path = "../ironbeam-cloud-service-api" }
ironbeam-cloud-fakes = { version = "0.1.0", path = "../ironbeam-cloud-fakes" }
ironbeam-cloud-ops = { version = "0.1.0", path = "../ironbeam-cloud-ops" }
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = { version = "1", optional = true }
zstd = { version = "0.13", optional = true }
bzip2 = { version = "0.6", optional = true }
xz2 = { version = "0.1", optional = true }

[features]
default = []
compression-gzip = ["dep:flate2", "ironbeam-compression/compression-gzip"]
compression-zstd = ["dep:zstd", "ironbeam-compression/compression-zstd"]
compression-bzip2 = ["dep:bzip2", "ironbeam-compression/compression-bzip2"]
compression-xz = ["dep:xz2", "ironbeam-compression/compression-xz"]

[dev-dependencies]
tempfile = "3"
