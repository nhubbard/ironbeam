[package]
name = "ironbeam-coder-postcard"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license = "MIT"
description = "Opt-in Postcard element coder for Ironbeam 5"
repository = "https://github.com/nhubbard/ironbeam"

[dependencies]
ironbeam-core = { version = "0.1.0", path = "../ironbeam-core" }
postcard = { version = "1", features = ["alloc"] }
serde = "1"

[dev-dependencies]
ironbeam-direct = { version = "0.1.0", path = "../ironbeam-direct" }
serde = { version = "1", features = ["derive"] }
