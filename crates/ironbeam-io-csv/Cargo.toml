[package]
name = "ironbeam-io-csv"
version = "5.0.0"
edition = "2024"
rust-version = "1.94.0"
license = "MIT"
description = "CSV sources and deferred sinks for Ironbeam 5"
repository = "https://github.com/nhubbard/ironbeam"

[features]
default = []
parallel-io = ["ironbeam-io/parallel-io"]
cloud = ["dep:ironbeam-cloud-objects", "dep:sha2"]
compression-gzip = ["ironbeam-io/compression-gzip"]
compression-zstd = ["ironbeam-io/compression-zstd"]
compression-bzip2 = ["ironbeam-io/compression-bzip2"]
compression-xz = ["ironbeam-io/compression-xz"]

[dependencies]
ironbeam-core = { version = "5.0.0", path = "../ironbeam-core" }
ironbeam-io = { version = "5.0.0", path = "../ironbeam-io", default-features = false, features = ["file"] }
ironbeam-cloud-objects = { version = "5.0.0", path = "../ironbeam-cloud-objects", optional = true }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sha2 = { version = "0.11", optional = true }

[dev-dependencies]
ironbeam-direct = { version = "5.0.0", path = "../ironbeam-direct" }
