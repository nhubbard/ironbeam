[package]
name = "ironbeam-cloud-object-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license = "MIT"
description = "Opt-in S3, GCS, and Azure object storage adapters for Ironbeam"
repository = "https://github.com/nhubbard/ironbeam"

[features]
default = []
aws = ["object_store/aws"]
gcp = ["object_store/gcp"]
azure = ["object_store/azure"]

[dependencies]
ironbeam-cloud = { version = "0.1.0", path = "../ironbeam-cloud" }
object_store = { version = "0.14.2", default-features = false }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread"] }
