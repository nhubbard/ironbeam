[package]
name = "ironbeam-io-jsonl"
version = "5.0.0"
edition = "2024"
rust-version = "1.94.0"
license = "MIT"
description = "JSON Lines file and object sources and deferred sinks for Ironbeam 5"
repository = "https://github.com/nhubbard/ironbeam"

[features]
default = []
parallel-io = ["ironbeam-io/parallel-io"]
cloud = ["dep:ironbeam-cloud-objects", "dep:ironbeam-compression", "dep:sha2", "dep:tempfile", "ironbeam-io/cloud"]
compression-gzip = ["ironbeam-io/compression-gzip", "ironbeam-compression?/compression-gzip"]
compression-zstd = ["ironbeam-io/compression-zstd", "ironbeam-compression?/compression-zstd"]
compression-bzip2 = ["ironbeam-io/compression-bzip2", "ironbeam-compression?/compression-bzip2"]
compression-xz = ["ironbeam-io/compression-xz", "ironbeam-compression?/compression-xz"]

[dependencies]
ironbeam-core = { version = "5.0.0", path = "../ironbeam-core" }
ironbeam-io = { version = "5.0.0", path = "../ironbeam-io", default-features = false, features = ["file"] }
ironbeam-cloud-objects = { version = "5.0.0", path = "../ironbeam-cloud-objects", optional = true }
ironbeam-compression = { version = "5.0.0", path = "../ironbeam-compression", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
ironbeam-direct = { version = "5.0.0", path = "../ironbeam-direct" }
ironbeam-cloud-fakes = { version = "5.0.0", path = "../ironbeam-cloud-fakes" }
tempfile = "3"
