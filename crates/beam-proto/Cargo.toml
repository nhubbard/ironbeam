[package]
name = "beam-proto"
version = "5.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Prost/tonic-generated Rust types for Apache Beam's portability .proto files"

[lib]
# Prost pulls proto comments into Rust doc comments. Many of them contain
# byte-diagram examples (`00 00 00 00 00 ...`) that rustdoc misreads as
# doctests. Disable doctest harness — nothing here is a real example.
doctest = false

[dependencies]
prost = { workspace = true }
prost-types = { workspace = true }
tonic = { workspace = true }

[build-dependencies]
prost-build = { workspace = true }
tonic-build = { workspace = true }
