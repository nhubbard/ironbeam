[package]
name = "ironbeam-io-avro"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license = "MIT"
description = "Native Avro sources and sinks for Ironbeam 5"
repository = "https://github.com/nhubbard/ironbeam"

[features]
default = []
parallel-io = ["ironbeam-io/parallel-io"]
compression-gzip = ["ironbeam-io/compression-gzip"]
compression-zstd = ["ironbeam-io/compression-zstd"]
compression-bzip2 = ["ironbeam-io/compression-bzip2"]
compression-xz = ["ironbeam-io/compression-xz"]

[dependencies]
ironbeam-core = { version = "0.1.0", path = "../ironbeam-core" }
ironbeam-io = { version = "0.1.0", path = "../ironbeam-io", default-features = false, features = ["file"] }
apache-avro = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sha2 = "0.11"

[dev-dependencies]
ironbeam-direct = { version = "0.1.0", path = "../ironbeam-direct" }
