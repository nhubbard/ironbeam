[workspace]
members = [".", "crates/ironbeam-core", "crates/ironbeam-direct", "crates/ironbeam-metrics", "crates/ironbeam-transforms", "crates/ironbeam-transform-regex", "crates/ironbeam-transform-approx", "crates/ironbeam-io", "crates/ironbeam-io-jsonl", "crates/ironbeam-io-protobuf", "crates/ironbeam-io-tfrecord", "crates/ironbeam-io-csv", "crates/ironbeam-io-xml", "crates/ironbeam-io-msgpack", "crates/ironbeam-io-cbor", "crates/ironbeam-io-avro", "crates/ironbeam-io-parquet", "crates/ironbeam-io-arrow", "crates/ironbeam-io-sql", "crates/ironbeam-io-mongodb", "crates/ironbeam-compression", "crates/ironbeam-coder-postcard", "crates/ironbeam-cloud-objects", "crates/ironbeam-cloud", "crates/ironbeam-cloud-object-store", "crates/ironbeam-testing", "crates/ironbeam-compat", "crates/ironbeam-runner-contract-tests"]
default-members = ["."]
resolver = "3"

[package]
name = "ironbeam"
rust-version = "1.94.0"
version = "4.1.1"
edition = "2024"
license = "MIT"
description = "A batch processing clone of Apache Beam in Rust."
repository = "https://github.com/nhubbard/ironbeam"

[features]
default = ["v5-preview"]
v5-preview = ["ironbeam-transforms/validation-json", "ironbeam-io/cloud", "ironbeam-io-jsonl/cloud"]
v5-regex = ["dep:ironbeam-transform-regex"]
v5-approx = ["dep:ironbeam-transform-approx"]
v5-testing = ["dep:ironbeam-testing"]
v5-metrics = ["dep:ironbeam-metrics", "ironbeam-direct/metrics"]
v5-compression = ["dep:ironbeam-compression"]
v5-io-sql = ["dep:ironbeam-io-sql"]
v5-io-mongodb = ["dep:ironbeam-io-mongodb"]
v5-io-avro = ["dep:ironbeam-io-avro"]
v5-io-csv = ["dep:ironbeam-io-csv"]
v5-io-xml = ["dep:ironbeam-io-xml"]
v5-io-msgpack = ["dep:ironbeam-io-msgpack"]
v5-io-cbor = ["dep:ironbeam-io-cbor"]
v5-io-protobuf = ["dep:ironbeam-io-protobuf"]
v5-io-tfrecord = ["dep:ironbeam-io-tfrecord"]
v5-io-parquet = ["dep:ironbeam-io-parquet"]
v5-io-arrow = ["dep:ironbeam-io-arrow"]

# IO backends
io-jsonl = []
io-csv = ["v5-io-csv"]
io-parquet = ["v5-io-parquet"]
io-avro = ["v5-io-avro"]
io-xml = ["v5-io-xml"]

# Additional I/O formats (Tier 5).
#
# Deliberate exception to the usual "everything on by default" tenet: these
# less-common connectors are intentionally absent from `default`. Each pulls in
# extra dependencies that would bloat the common build, so users opt in.
io-msgpack = ["v5-io-msgpack"]
io-cbor = ["v5-io-cbor"]
io-protobuf = ["v5-io-protobuf"]
io-tfrecord = ["v5-io-tfrecord"]
io-arrow = ["v5-io-arrow"]
io-sql = ["v5-io-sql", "dep:sqlx", "dep:tokio"]
io-mongodb = ["v5-io-mongodb", "dep:mongodb", "dep:bson", "dep:tokio"]

# Compression codecs (pluggable)
compression-gzip = ["v5-compression", "ironbeam-compression/compression-gzip", "ironbeam-io/compression-gzip", "ironbeam-io-jsonl/compression-gzip"]
compression-zstd = ["v5-compression", "ironbeam-compression/compression-zstd", "ironbeam-io/compression-zstd", "ironbeam-io-jsonl/compression-zstd"]
compression-bzip2 = ["v5-compression", "ironbeam-compression/compression-bzip2", "ironbeam-io/compression-bzip2", "ironbeam-io-jsonl/compression-bzip2"]
compression-xz = ["v5-compression", "ironbeam-compression/compression-xz", "ironbeam-io/compression-xz", "ironbeam-io-jsonl/compression-xz"]

# Behaviors
parallel-io = ["ironbeam-io/parallel-io", "ironbeam-io-jsonl/parallel-io"]
metrics = ["v5-metrics"]
checkpointing = []
spilling = []
# Keep the old feature name for the opt-in Postcard Element implementation macro.
coders = ["dep:ironbeam-coder-postcard"]

[dependencies]
ironbeam-compression = { version = "0.1.0", path = "crates/ironbeam-compression", optional = true }
ironbeam-coder-postcard = { version = "0.1.0", path = "crates/ironbeam-coder-postcard", optional = true }
ironbeam-core = { version = "0.1.0", path = "crates/ironbeam-core" }
ironbeam-direct = { version = "0.1.0", path = "crates/ironbeam-direct" }
ironbeam-transforms = { version = "0.1.0", path = "crates/ironbeam-transforms" }
ironbeam-transform-regex = { version = "0.1.0", path = "crates/ironbeam-transform-regex", optional = true }
ironbeam-transform-approx = { version = "0.1.0", path = "crates/ironbeam-transform-approx", optional = true }
ironbeam-testing = { version = "0.1.0", path = "crates/ironbeam-testing", optional = true }
ironbeam-metrics = { version = "0.1.0", path = "crates/ironbeam-metrics", optional = true }
ironbeam-io = { version = "0.1.0", path = "crates/ironbeam-io", default-features = false }
ironbeam-io-jsonl = { version = "0.1.0", path = "crates/ironbeam-io-jsonl" }
ironbeam-io-protobuf = { version = "0.1.0", path = "crates/ironbeam-io-protobuf", optional = true }
ironbeam-io-tfrecord = { version = "0.1.0", path = "crates/ironbeam-io-tfrecord", optional = true }
ironbeam-io-avro = { version = "0.1.0", path = "crates/ironbeam-io-avro", optional = true }
ironbeam-io-csv = { version = "0.1.0", path = "crates/ironbeam-io-csv", optional = true }
ironbeam-io-xml = { version = "0.1.0", path = "crates/ironbeam-io-xml", optional = true }
ironbeam-io-msgpack = { version = "0.1.0", path = "crates/ironbeam-io-msgpack", optional = true }
ironbeam-io-cbor = { version = "0.1.0", path = "crates/ironbeam-io-cbor", optional = true }
ironbeam-io-parquet = { version = "0.1.0", path = "crates/ironbeam-io-parquet", optional = true }
ironbeam-io-arrow = { version = "0.1.0", path = "crates/ironbeam-io-arrow", optional = true }
ironbeam-io-sql = { version = "0.1.0", path = "crates/ironbeam-io-sql", optional = true }
ironbeam-io-mongodb = { version = "0.1.0", path = "crates/ironbeam-io-mongodb", optional = true }
# SQL example dependency (opt-in with the connector)
sqlx = { version = "0.9", features = ["any", "postgres", "mysql", "sqlite", "runtime-tokio", "tls-rustls-ring"], optional = true }

# MongoDB example dependencies (opt-in with the connector)
#
# `mongodb` defaults to its `bson-2` compatibility feature; `bson-3` is enabled explicitly so
# `mongodb::bson::Document` resolves to the same `bson` 3.1.0 crate instance as our own `bson`
# dependency below (otherwise cargo would link two incompatible `Document` types).
mongodb = { version = "3", features = ["bson-3"], optional = true }
bson = { version = "3", optional = true }

# Async runtime bridge (shared by io-sql and io-mongodb)
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }

[dev-dependencies]
anyhow = "1"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unused_imports = "allow"

[lints.clippy]
large_futures = "allow"

