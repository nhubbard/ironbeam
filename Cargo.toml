[workspace]
members = [".", "crates/ironbeam-core", "crates/ironbeam-direct", "crates/ironbeam-metrics", "crates/ironbeam-transforms", "crates/ironbeam-transform-regex", "crates/ironbeam-transform-approx", "crates/ironbeam-io", "crates/ironbeam-io-jsonl", "crates/ironbeam-io-protobuf", "crates/ironbeam-io-tfrecord", "crates/ironbeam-io-csv", "crates/ironbeam-io-xml", "crates/ironbeam-io-msgpack", "crates/ironbeam-io-cbor", "crates/ironbeam-io-avro", "crates/ironbeam-io-parquet", "crates/ironbeam-io-arrow", "crates/ironbeam-io-sql", "crates/ironbeam-io-mongodb", "crates/ironbeam-compression", "crates/ironbeam-cloud-objects", "crates/ironbeam-cloud", "crates/ironbeam-cloud-object-store", "crates/ironbeam-testing", "crates/ironbeam-compat", "crates/ironbeam-runner-contract-tests"]
default-members = ["."]
resolver = "3"

[package]
name = "ironbeam"
rust-version = "1.94.0"
version = "4.1.1"
edition = "2024"
license = "MIT"
description = "A batch processing clone of Apache Beam in Rust."
repository = "https://github.com/nhubbard/ironbeam"

[features]
default = ["v5-preview"]
legacy-v4 = ["dep:ironbeam-cloud", "dep:anyhow", "dep:serde", "dep:serde_json", "dep:rayon", "dep:num_cpus", "dep:ordered-float", "dep:glob", "dep:regex", "dep:paste", "dep:hyperloglogplus", "dep:tempfile"]
legacy-v4-service-tests = ["legacy-v4", "dep:testcontainers", "dep:testcontainers-modules"]
v5-preview = ["dep:ironbeam-core", "dep:ironbeam-direct", "dep:ironbeam-transforms", "ironbeam-transforms/validation-json", "dep:ironbeam-io", "ironbeam-io/cloud", "dep:ironbeam-io-jsonl", "ironbeam-io-jsonl/cloud"]
v5-regex = ["v5-preview", "dep:ironbeam-transform-regex"]
v5-approx = ["v5-preview", "dep:ironbeam-transform-approx"]
v5-testing = ["v5-preview", "dep:ironbeam-testing"]
v5-metrics = ["v5-preview", "dep:ironbeam-metrics", "ironbeam-direct/metrics"]
v5-compression = ["v5-preview", "dep:ironbeam-compression"]
v5-io-sql = ["v5-preview", "dep:ironbeam-io-sql"]
v5-io-mongodb = ["v5-preview", "dep:ironbeam-io-mongodb"]
v5-io-avro = ["v5-preview", "dep:ironbeam-io-avro"]
v5-io-csv = ["v5-preview", "dep:ironbeam-io-csv"]
v5-io-xml = ["v5-preview", "dep:ironbeam-io-xml"]
v5-io-msgpack = ["v5-preview", "dep:ironbeam-io-msgpack"]
v5-io-cbor = ["v5-preview", "dep:ironbeam-io-cbor"]
v5-io-protobuf = ["v5-preview", "dep:ironbeam-io-protobuf", "dep:prost"]
v5-io-tfrecord = ["v5-preview", "dep:ironbeam-io-tfrecord"]
v5-io-parquet = ["v5-preview", "dep:ironbeam-io-parquet"]
v5-io-arrow = ["v5-preview", "dep:ironbeam-io-arrow"]

# IO backends
io-jsonl = ["v5-preview"]
io-csv = ["v5-io-csv", "dep:csv"]
io-parquet = ["v5-io-parquet", "dep:parquet", "dep:arrow", "dep:serde_arrow"]
io-avro = ["v5-io-avro", "dep:apache-avro"]
io-xml = ["v5-io-xml", "dep:quick-xml"]

# Additional I/O formats (Tier 5).
#
# Deliberate exception to the usual "everything on by default" tenant: these
# less-common connectors are intentionally absent from `default`. Each pulls in
# extra dependencies that would bloat the common build, so users opt in.
io-msgpack = ["v5-io-msgpack", "dep:rmp-serde"]
io-cbor = ["v5-io-cbor", "dep:ciborium"]
io-protobuf = ["v5-io-protobuf", "dep:prost"]
io-tfrecord = ["v5-io-tfrecord", "dep:crc32c"]
io-arrow = ["v5-io-arrow", "dep:arrow", "dep:serde_arrow"]
io-sql = ["v5-io-sql", "dep:sqlx", "dep:tokio"]
io-mongodb = ["v5-io-mongodb", "dep:mongodb", "dep:bson", "dep:tokio"]

# Compression codecs (pluggable)
compression-gzip = ["v5-compression", "dep:flate2", "ironbeam-compression/compression-gzip", "ironbeam-cloud?/compression-gzip", "ironbeam-io?/compression-gzip", "ironbeam-io-jsonl?/compression-gzip"]
compression-zstd = ["v5-compression", "dep:zstd", "ironbeam-compression/compression-zstd", "ironbeam-cloud?/compression-zstd", "ironbeam-io?/compression-zstd", "ironbeam-io-jsonl?/compression-zstd"]
compression-bzip2 = ["v5-compression", "dep:bzip2", "ironbeam-compression/compression-bzip2", "ironbeam-cloud?/compression-bzip2", "ironbeam-io?/compression-bzip2", "ironbeam-io-jsonl?/compression-bzip2"]
compression-xz = ["v5-compression", "dep:xz2", "ironbeam-compression/compression-xz", "ironbeam-cloud?/compression-xz", "ironbeam-io?/compression-xz", "ironbeam-io-jsonl?/compression-xz"]

# Behaviors
parallel-io = ["ironbeam-io?/parallel-io", "ironbeam-io-jsonl?/parallel-io"]
metrics = ["v5-metrics"]
checkpointing = ["dep:postcard", "dep:sha2"]
spilling = ["dep:postcard"]

# Attach a per-PCollection Postcard-backed coder to every node at build time, so
# backends that ship elements across a wire (e.g., the Dataflow harness) can
# encode/decode each PCollection without the user registering types by hand.
# Tightens `Element` to require `serde::{Serialize, DeserializeOwned}`.
coders = ["dep:postcard"]

[dependencies]
ironbeam-compression = { version = "0.1.0", path = "crates/ironbeam-compression", optional = true }
ironbeam-cloud = { version = "0.1.0", path = "crates/ironbeam-cloud", optional = true }
ironbeam-core = { version = "0.1.0", path = "crates/ironbeam-core", optional = true }
ironbeam-direct = { version = "0.1.0", path = "crates/ironbeam-direct", optional = true }
ironbeam-transforms = { version = "0.1.0", path = "crates/ironbeam-transforms", optional = true }
ironbeam-transform-regex = { version = "0.1.0", path = "crates/ironbeam-transform-regex", optional = true }
ironbeam-transform-approx = { version = "0.1.0", path = "crates/ironbeam-transform-approx", optional = true }
ironbeam-testing = { version = "0.1.0", path = "crates/ironbeam-testing", optional = true }
ironbeam-metrics = { version = "0.1.0", path = "crates/ironbeam-metrics", optional = true }
ironbeam-io = { version = "0.1.0", path = "crates/ironbeam-io", default-features = false, optional = true }
ironbeam-io-jsonl = { version = "0.1.0", path = "crates/ironbeam-io-jsonl", optional = true }
ironbeam-io-protobuf = { version = "0.1.0", path = "crates/ironbeam-io-protobuf", optional = true }
ironbeam-io-tfrecord = { version = "0.1.0", path = "crates/ironbeam-io-tfrecord", optional = true }
ironbeam-io-avro = { version = "0.1.0", path = "crates/ironbeam-io-avro", optional = true }
ironbeam-io-csv = { version = "0.1.0", path = "crates/ironbeam-io-csv", optional = true }
ironbeam-io-xml = { version = "0.1.0", path = "crates/ironbeam-io-xml", optional = true }
ironbeam-io-msgpack = { version = "0.1.0", path = "crates/ironbeam-io-msgpack", optional = true }
ironbeam-io-cbor = { version = "0.1.0", path = "crates/ironbeam-io-cbor", optional = true }
ironbeam-io-parquet = { version = "0.1.0", path = "crates/ironbeam-io-parquet", optional = true }
ironbeam-io-arrow = { version = "0.1.0", path = "crates/ironbeam-io-arrow", optional = true }
ironbeam-io-sql = { version = "0.1.0", path = "crates/ironbeam-io-sql", optional = true }
ironbeam-io-mongodb = { version = "0.1.0", path = "crates/ironbeam-io-mongodb", optional = true }
# Core dependencies
anyhow = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
rayon = { version = "1", optional = true }
num_cpus = { version = "1", optional = true }
ordered-float = { version = "5", optional = true }
glob = { version = "0.3", optional = true }
postcard = { version = "1", features = ["alloc"], optional = true }
sha2 = { version = "0.11", optional = true }
regex = { version = "1.12.4", optional = true }
paste = { version = "1", optional = true }
hyperloglogplus = { version = "0.4", optional = true }

# Optional encoding formats
apache-avro = { version = "0.22", optional = true }
quick-xml = { version = "0.41", features = ["serialize"], optional = true }
csv = { version = "1", optional = true }
rmp-serde = { version = "1", optional = true }
ciborium = { version = "0.2", optional = true }
prost = { version = "0.14", optional = true }
crc32c = { version = "0.6", optional = true }
arrow = { version = "59", optional = true }
parquet = { version = "59", optional = true }
serde_arrow = { version = "0.15", optional = true, features = ["arrow-59"] }

# SQL I/O (Tier 5, opt-in)
sqlx = { version = "0.9", features = ["any", "postgres", "mysql", "sqlite", "runtime-tokio", "tls-rustls-ring"], optional = true }

# MongoDB I/O (Tier 5, opt-in)
#
# `mongodb` defaults to its `bson-2` compatibility feature; `bson-3` is enabled explicitly so
# `mongodb::bson::Document` resolves to the same `bson` 3.1.0 crate instance as our own `bson`
# dependency below (otherwise cargo would link two incompatible `Document` types).
mongodb = { version = "3", features = ["bson-3"], optional = true }
bson = { version = "3", optional = true }

# Async runtime bridge (shared by io-sql and io-mongodb)
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }

# Compression codecs
flate2 = { version = "1", optional = true }
zstd = { version = "0.13", optional = true }
bzip2 = { version = "0.6", optional = true }
xz2 = { version = "0.1", optional = true }

# Testing dependency, used in testing module and in tests
tempfile = { version = "3", optional = true }
# Live v4 database suites are kept opt-in while the root v5 facade is tested.
testcontainers = { version = "0.27", features = ["blocking"], optional = true }
testcontainers-modules = { version = "0.15", features = ["mongo", "postgres", "mysql"], optional = true }

[dev-dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
regex = "1.12.4"
tempfile = "3"

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unused_imports = "allow"

[lints.clippy]
large_futures = "allow"

